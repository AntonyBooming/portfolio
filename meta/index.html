<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../global.js" type="module"></script>
  </head>
  <body>
    <h1>Meta</h1>
    <p>This page includes stats about the code of this website.</p>

    <div style="display: flex; align-items: baseline; gap: 1rem;">
      <label for="commit-progress" style="white-space: nowrap;">Show commits until:</label>
      <input type="range" id="commit-progress" min="0" max="100" value="100" style="flex: 1;" />
      <time id="commit-time" style="white-space: nowrap;"></time>
    </div>

    <div id="scrolly-1">
      <div id="scatter-story"></div>
      <div id="scatter-plot">
        <div id="stats"></div>

        <dl id="commit-tooltip" class="info tooltip">
          <dt>Commit</dt>
          <dd><a href="" id="commit-link" target="_blank"></a></dd>
          <dt>Date</dt>
          <dd id="commit-date"></dd>
        </dl>

        <h2>Commits by time of day</h2>
        <div id="chart"></div>

        <dl id="files"></dl>

        <p id="selection-count">No commits selected</p>
        <dl id="language-breakdown" class="stats"></dl>
      </div>
    </div>

    <script src="main.js" type="module"></script>
  </body>
</html>
